<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>计数上线验收（临时）</title>
<style>body{font:18px/1.7 system-ui;max-width:860px;margin:40px auto;padding:0 20px}button{font:inherit;padding:10px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:16px}a{color:#246}</style>
<h1>计数上线验收（临时）</h1><p>本站维护者的公开验收入口。仅用于一次上线测试，不代表真实访客。不会自动发送请求；所有合法提交固定为同一文章、同一事件，最多增加一次。验收后删除此页。</p>
<p>文章：<strong>37111687</strong>；事件：<code>7595e273-4a37-414d-b2fa-fb956be55fc4</code></p>
<button id="read">只读回查</button><button id="first">提交一次测试访问</button><button id="retry" disabled>重试同一事件</button><button id="invalid" disabled>测试非法文章拒绝</button>
<p><a href="/posts/37111687.html">查看对应文章</a></p><pre id="result" role="status">尚未执行。</pre>
<script type="module">
const endpoint='https://blog-view-counter.kitdnie.workers.dev', articleId='37111687', eventId='7595e273-4a37-414d-b2fa-fb956be55fc4';
const result=document.querySelector('#result'), buttons=[...document.querySelectorAll('button')];
let accepted=false, stopped=false;
async function run(kind){
 if(location.origin!=='https://blog.jobshen.com'){result.textContent='仅允许在正式站点执行。';return;}
 buttons.forEach(b=>b.disabled=true);
 const id=kind==='invalid'?'invalid':articleId, method=kind==='read'?'GET':'POST';
 const entry={at:new Date().toISOString(),action:kind,method,articleId:id,eventId:method==='POST'?eventId:undefined};
 try{
  const response=await fetch(`${endpoint}/v1/articles/${id}/views`,{method,credentials:'omit',signal:AbortSignal.timeout(10000),...(method==='POST'?{headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId})}:{})});
  entry.httpStatus=response.status;entry.body=await response.json();
  if(kind!=='invalid'&&!response.ok){stopped=true;entry.note='请求被拒绝，停止后续写入验收。';}
  if(method==='POST'&&kind!=='invalid'&&response.ok&&entry.body.status==='ok'){
   accepted=true;
   // Use the same documented event record as the normal article client, so the
   // final normal visit in this browser acknowledges this test instead of adding another.
   localStorage.setItem(`blog:view-event:v1:${endpoint}:${articleId}`,JSON.stringify({eventId,createdAt:Date.now(),acknowledged:true}));
   localStorage.setItem(`blog:views:v1:${endpoint}:${articleId}`,JSON.stringify(entry.body));
  }
 }catch(error){entry.error=error.name+': '+error.message;entry.note=kind==='invalid'?'非法路径的预检若被拒绝，浏览器会隐藏响应；以网络记录核对。':'结果不确定，停止写入；不要产生新事件。';if(kind!=='invalid')stopped=true;}
 result.textContent += '\n\n'+JSON.stringify(entry,null,2);
 document.querySelector('#read').disabled=false;
 document.querySelector('#first').disabled=accepted||stopped;
 document.querySelector('#retry').disabled=!accepted||stopped;
 document.querySelector('#invalid').disabled=!accepted||stopped;
}
for(const button of buttons)button.addEventListener('click',()=>run(button.id));
</script></html>
